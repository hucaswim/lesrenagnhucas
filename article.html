<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artikel | HUCAS Swimming Class</title>
<meta name="description" content="Artikel dan tips belajar renang dari HUCAS Swimming Class, Denpasar, Bali.">
<meta name="theme-color" content="#FFD400">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#2A2FE4; --yellow:#FFD400; --pink:#F31569; --teal:#00BF8F; --navy:#0B1440; --cream:#FFFCF2; --white:#fff;}
  *{box-sizing:border-box;}
  body{margin:0; font-family:'Poppins',sans-serif; color:var(--navy); background:var(--cream); -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif; line-height:1.15; margin:0;}
  a{color:inherit;}
  img{max-width:100%; display:block;}
  body:not(.lang-en) [data-en]{display:none !important;}
  body.lang-en [data-id]{display:none !important;}

  header{position:sticky; top:0; z-index:50; background:rgba(255,252,242,.94); backdrop-filter:blur(6px); border-bottom:3px solid var(--navy);}
  .nav-inner{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 24px; max-width:1140px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand img{height:44px; width:auto;}
  .brand-text{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.25rem;}
  .nav-right{display:flex; align-items:center; gap:12px;}
  .lang-switch{display:flex; background:var(--navy); border-radius:999px; padding:4px; gap:2px;}
  .lang-switch button{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.8rem; border:none; background:transparent; color:#ffffff99; padding:7px 14px; border-radius:999px; cursor:pointer;}
  .lang-switch button.active{background:var(--yellow); color:var(--navy);}
  .btn{display:inline-flex; align-items:center; gap:8px; font-family:'Baloo 2',sans-serif; font-weight:700; padding:12px 26px; border-radius:999px; text-decoration:none; border:3px solid var(--navy); background:var(--yellow); color:var(--navy); box-shadow:4px 4px 0 var(--navy);}
  .btn.teal{background:var(--teal);}
  @media(max-width:640px){ .nav-cta{display:none;} }

  .wrap{max-width:760px; margin:0 auto; padding:40px 24px 70px;}
  .crumbs{font-size:.82rem; color:#6a6f96; margin-bottom:18px;}
  .crumbs a{text-decoration:none; font-weight:600; color:var(--blue);}
  .tag{display:inline-block; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.75rem; background:var(--yellow); border:2px solid var(--navy); border-radius:999px; padding:4px 14px; margin-bottom:14px;}
  h1{font-size:clamp(1.9rem,5vw,2.7rem); color:var(--navy);}
  .meta{margin:14px 0 24px; font-size:.85rem; color:#6a6f96; font-weight:500;}
  .cover{border:3px solid var(--navy); border-radius:22px; overflow:hidden; margin-bottom:30px; box-shadow:6px 6px 0 var(--navy);}
  .cover img{width:100%; height:auto; max-height:420px; object-fit:cover;}
  .content{font-size:1.04rem; line-height:1.8; color:#26305c;}
  .content h2{font-size:1.45rem; color:var(--blue); margin:34px 0 10px;}
  .content h3{font-size:1.2rem; color:var(--navy); margin:26px 0 8px;}
  .content p{margin:0 0 1.1em;}
  .content ul{margin:0 0 1.2em; padding-left:1.3em;}
  .content li{margin-bottom:.4em;}
  .content a{color:var(--pink); font-weight:600;}
  .content img{border-radius:14px; margin:20px 0;}
  .cta-box{margin-top:44px; background:var(--navy); color:var(--white); border-radius:24px; padding:32px; text-align:center;}
  .cta-box h2{font-size:1.5rem; color:var(--yellow); margin-bottom:10px;}
  .cta-box p{margin:0 0 20px; color:#dfe1ff;}
  .related{margin-top:50px;}
  .related h2{font-size:1.3rem; margin-bottom:16px;}
  .rel-list{display:grid; gap:12px;}
  .rel-item{display:block; text-decoration:none; background:var(--white); border:3px solid var(--navy); border-radius:16px; padding:16px 20px;}
  .rel-item b{font-family:'Baloo 2',sans-serif; font-size:1.05rem; display:block;}
  .rel-item span{font-size:.84rem; color:#6a6f96;}
  .notfound{text-align:center; padding:80px 0;}
  footer{background:var(--navy); color:#c7cbee; text-align:center; padding:30px 24px; font-size:.85rem;}
  footer a{color:var(--yellow);}
</style>
</head>
<body>
<header>
  <div class="nav-inner">
    <a class="brand" href="index.html"><img src="logo.png" alt="HUCAS logo"><span class="brand-text">HUCAS</span></a>
    <div class="nav-right">
      <div class="lang-switch">
        <button id="btn-id" class="active" onclick="setLang('id')">ID</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
      </div>
      <a class="btn teal nav-cta wa-link" href="#" target="_blank" rel="noopener"><span data-id>Chat WhatsApp</span><span data-en>Chat on WhatsApp</span></a>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer>
  <div>© 2026 HUCAS Swimming Class · <a href="index.html">Home</a> · <a id="foot-ig" href="#" target="_blank" rel="noopener">Instagram</a> · <a href="privacy.html">Privasi / Privacy</a> <a href="#" data-cookie-settings style="display:none">· Cookie</a></div>
</footer>

<script src="data.js"></script>
<script src="tracking.js"></script>
<script>
  var D = window.HUCAS_DATA;
  var currentLang = 'id';
  try{ if(localStorage.getItem('hucas-lang') === 'en') currentLang = 'en'; }catch(e){}
  var slug = new URLSearchParams(location.search).get('slug');
  var post = null;
  (D.blog || []).forEach(function(p){ if((p.slug || p.id) === slug) post = p; });

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function inline(t){
    t = esc(t);
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*|#[^\s)]*)\)/g, '<a href="$2">$1</a>');
    return t;
  }
  // Mini-markdown: "## Judul", "### Sub", "- poin", paragraf dipisah baris kosong
  function renderBody(text){
    var blocks = String(text || '').replace(/\r/g, '').split(/\n{2,}/);
    return blocks.map(function(b){
      b = b.trim(); if(!b) return '';
      var lines = b.split('\n');
      var out = [], list = [], para = [];
      function flushList(){ if(list.length){ out.push('<ul>' + list.map(function(li){ return '<li>' + inline(li) + '</li>'; }).join('') + '</ul>'); list = []; } }
      function flushPara(){ if(para.length){ out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } }
      lines.forEach(function(l){
        if(/^###\s+/.test(l)){ flushList(); flushPara(); out.push('<h3>' + inline(l.replace(/^###\s+/, '')) + '</h3>'); }
        else if(/^##\s+/.test(l)){ flushList(); flushPara(); out.push('<h2>' + inline(l.replace(/^##\s+/, '')) + '</h2>'); }
        else if(/^-\s+/.test(l)){ flushPara(); list.push(l.replace(/^-\s+/, '')); }
        else { flushList(); para.push(l); }
      });
      flushList(); flushPara();
      return out.join('');
    }).join('');
  }
  function setMeta(attr, key, content){
    var el = document.querySelector('meta[' + attr + '="' + key + '"]');
    if(!el){ el = document.createElement('meta'); el.setAttribute(attr, key); document.head.appendChild(el); }
    el.setAttribute('content', content);
  }
  function pick(obj, field){ return obj[field + '_' + currentLang] || obj[field + '_id'] || obj[field + '_en'] || ''; }

  function render(){
    var main = document.getElementById('main');
    var S = D.seo || {};
    var base = (S.siteUrl || '').replace(/\/$/, '');
    var biz = S.businessName || 'HUCAS Swimming Class';

    if(!post){
      document.title = (currentLang === 'en' ? 'Article not found' : 'Artikel tidak ditemukan') + ' | ' + biz;
      setMeta('name', 'robots', 'noindex');
      main.innerHTML = '<div class="notfound"><h1>' + (currentLang === 'en' ? 'Article not found' : 'Artikel tidak ditemukan') + '</h1><p><a class="btn" href="index.html#blog">' + (currentLang === 'en' ? 'Back to blog' : 'Kembali ke blog') + '</a></p></div>';
      return;
    }

    var title = pick(post, 'title'), excerpt = pick(post, 'excerpt'), tag = pick(post, 'tag');
    var body = pick(post, 'body');
    var date = new Date(post.date + 'T00:00:00');
    var dateStr = date.toLocaleDateString(currentLang === 'en' ? 'en-US' : 'id-ID', {day:'numeric', month:'long', year:'numeric'});
    var author = (D.coaches && D.coaches[0]) ? D.coaches[0].name : biz;

    var related = (D.blog || []).filter(function(p){ return p !== post; }).slice(0, 3);

    main.innerHTML =
      '<nav class="crumbs"><a href="index.html">Home</a> › <a href="index.html#blog">Blog</a> › ' + esc(title) + '</nav>' +
      '<article>' +
        '<span class="tag">' + esc(tag) + '</span>' +
        '<h1>' + esc(title) + '</h1>' +
        '<div class="meta">' + esc(dateStr) + ' · ' + esc(author) + '</div>' +
        (post.image ? '<div class="cover"><img src="' + esc(post.image) + '" alt="' + esc(title) + '"></div>' : '') +
        '<div class="content">' + (body ? renderBody(body) : '<p>' + esc(excerpt) + '</p>') + '</div>' +
      '</article>' +
      '<div class="cta-box"><h2>' + (currentLang === 'en' ? 'Ready to start swimming?' : 'Siap mulai belajar berenang?') + '</h2>' +
        '<p>' + (currentLang === 'en' ? 'Message HUCAS on WhatsApp to pick a class, location and schedule.' : 'Hubungi HUCAS lewat WhatsApp untuk pilih kelas, lokasi, dan jadwal.') + '</p>' +
        '<a class="btn wa-link" href="https://wa.me/' + D.brand.phone + '" target="_blank" rel="noopener">💬 ' + esc(D.brand.phoneDisplay) + '</a></div>' +
      (related.length ? '<div class="related"><h2>' + (currentLang === 'en' ? 'More articles' : 'Artikel lainnya') + '</h2><div class="rel-list">' +
        related.map(function(p){ return '<a class="rel-item" href="article.html?slug=' + encodeURIComponent(p.slug || p.id) + '"><b>' + esc(pick(p, 'title')) + '</b><span>' + esc(pick(p, 'tag')) + '</span></a>'; }).join('') +
      '</div></div>' : '');

    // ----- SEO -----
    var fullTitle = title + ' | ' + biz;
    document.title = fullTitle;
    setMeta('name', 'description', excerpt);
    setMeta('name', 'robots', 'index, follow, max-image-preview:large');
    setMeta('property', 'og:type', 'article');
    setMeta('property', 'og:title', title);
    setMeta('property', 'og:description', excerpt);
    setMeta('property', 'og:site_name', biz);
    setMeta('property', 'og:locale', currentLang === 'en' ? 'en_US' : 'id_ID');
    setMeta('name', 'twitter:card', 'summary_large_image');
    setMeta('name', 'twitter:title', title);
    setMeta('name', 'twitter:description', excerpt);
    var img = (/^https?:\/\//.test(post.image || '') ? post.image : '') || (D.images && D.images.ogImage) || '';
    if(img){ setMeta('property', 'og:image', img); setMeta('name', 'twitter:image', img); }
    var url = base ? base + '/article.html?slug=' + encodeURIComponent(post.slug || post.id) : '';
    if(url){
      var can = document.querySelector('link[rel="canonical"]');
      if(!can){ can = document.createElement('link'); can.rel = 'canonical'; document.head.appendChild(can); }
      can.href = url;
      setMeta('property', 'og:url', url);
    }
    var ld = {
      '@context': 'https://schema.org',
      '@graph': [
        {'@type': 'Article', headline: title, description: excerpt, datePublished: post.date, dateModified: post.date,
         inLanguage: currentLang, image: img || undefined, mainEntityOfPage: url || undefined,
         author: {'@type': 'Person', name: author},
         publisher: {'@type': 'Organization', name: biz, logo: base ? {'@type':'ImageObject', url: base + '/logo.png'} : undefined}},
        {'@type': 'BreadcrumbList', itemListElement: [
          {'@type':'ListItem', position:1, name:'Home', item: base ? base + '/' : undefined},
          {'@type':'ListItem', position:2, name:'Blog', item: base ? base + '/#blog' : undefined},
          {'@type':'ListItem', position:3, name:title}
        ]}
      ]
    };
    var s = document.getElementById('ld-json');
    if(!s){ s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'ld-json'; document.head.appendChild(s); }
    s.textContent = JSON.stringify(ld);
  }

  function setLang(lang){
    currentLang = lang;
    document.body.classList.toggle('lang-en', lang === 'en');
    document.getElementById('btn-id').classList.toggle('active', lang === 'id');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;
    try{ localStorage.setItem('hucas-lang', lang); }catch(e){}
    render();
  }
  document.querySelectorAll('.wa-link').forEach(function(a){ a.href = 'https://wa.me/' + D.brand.phone; });
  document.getElementById('foot-ig').href = 'https://instagram.com/' + D.brand.instagram;
  setLang(currentLang);
</script>
</body>
</html>
